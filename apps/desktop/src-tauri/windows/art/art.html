<!doctype html>
<!--
  Artwork for the NSIS installer, rendered by scripts/installer-art.ps1:
  ?sidebar  → windows/sidebar.bmp (164 x 314, welcome and finish pages)
  ?header   → windows/header.bmp  (150 x 57, top right of the other pages)
  Drawn at four times the size and scaled down, so the lines stay smooth.
  The same picture as the website: the Y, and the two world lines (cyan for
  the AI, brass for the computer) braiding out of its stem.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Instrument Sans';
    src: url(../../../../../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-standard-normal.woff2) format('woff2-variations');
    font-weight: 400 700;
    font-stretch: 75% 100%;
  }
  html, body { margin: 0; background: #111726; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
  const S = 4; // render scale
  const BG = '#111726';
  const FROST = '#E6ECF5';
  const QUBIT = [34, 211, 238];
  const BRASS = [201, 166, 107];
  const sidebar = location.search.includes('sidebar');
  const W = (sidebar ? 164 : 150) * S;
  const H = (sidebar ? 314 : 57) * S;
  const svg = document.getElementById('art');
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (name, attrs, parent = svg) => {
    const e = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    parent.appendChild(e);
    return e;
  };
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  /** The Ylide mark (docs/brand/ylide-mark.svg) at x, y with the given size. */
  function mark(x, y, size) {
    const g = el('g', { transform: `translate(${x} ${y}) scale(${size / 1024})` });
    const defs = el('defs', {}, g);
    const cut = el('clipPath', { id: 'cut' }, defs);
    el('rect', { x: 0, y: 128, width: 1024, height: 768 }, cut);
    const under = el('clipPath', { id: 'under' }, defs);
    el('path', { 'clip-rule': 'evenodd', d: 'M-64 -64 H1088 V1088 H-64 Z M430.04 83.53 L725.72 435.91 L593.96 546.47 L298.28 194.09 Z' }, under);
    const lines = el('g', { 'clip-path': 'url(#cut)', fill: 'none', stroke: FROST, 'stroke-width': 120 }, g);
    el('path', { d: 'M736.04 48 L512 315 L436.05 405.51 A175 175 0 0 0 436.05 630.49 L474.57 676.39 A160 160 0 0 1 512 779.24 L512 976', 'clip-path': 'url(#under)' }, lines);
    el('path', { d: 'M287.96 48 L512 315 L587.95 405.51 A175 175 0 0 1 587.95 630.49 L549.43 676.39 A160 160 0 0 0 512 779.24 L512 976' }, lines);
  }

  /**
   * Two braided lines along a path given by `at(t)` → {x, y, nx, ny} (point and
   * unit normal), t from 0 to 1. Front segments get a gap in the background
   * colour behind them, like the logo.
   */
  function braid(at, { turns, amp, start = 0, end = 1, width = 1.7 * S, startWidth = width, fadeIn = 0, fadeOut = 0 }) {
    const N = 600;
    const pts = [[], []];
    for (let k = 0; k <= N; k++) {
      const t = k / N;
      const p = at(t);
      const grow = smooth(start, start + 0.12, t) * (1 - smooth(end - 0.12, end, t));
      const phase = t * turns * Math.PI;
      for (let i = 0; i < 2; i++) {
        const s = Math.sin(phase + i * Math.PI);
        const z = Math.cos(phase + i * Math.PI);
        const off = amp * grow * s + (i ? 1 : -1) * (startWidth / 2) * (1 - smooth(0, 0.08, t));
        const alpha = smooth(0, fadeIn || 1e-9, t) * (1 - smooth(1 - (fadeOut || 1e-9), 1, t));
        pts[i].push({ x: p.x + p.nx * off, y: p.y + p.ny * off, z, w: width + (startWidth - width) * (1 - smooth(0, 0.1, t)), a: alpha, tint: smooth(0, 0.18, t) });
      }
    }
    // Chunks of a few points with one look each: per line, split where it
    // changes between back and front. Colours are mixed with the background
    // up front, so overlapping chunk ends show no darker dots.
    const FROSTC = [230, 236, 245];
    const BGC = [17, 23, 38];
    const mix = (a, b, t) => a.map((v, j) => Math.round(v + (b[j] - v) * t));
    const chunks = [];
    for (let i = 0; i < 2; i++) {
      let cur = null;
      for (let k = 0; k < pts[i].length; k++) {
        const p = pts[i][k];
        const front = p.z > pts[1 - i][k].z;
        if (!cur || cur.front !== front || cur.pts.length >= 8) {
          if (cur) chunks.push(cur);
          cur = { i, front, pts: cur ? [cur.pts[cur.pts.length - 1]] : [] };
        }
        cur.pts.push(p);
      }
      if (cur) chunks.push(cur);
    }
    const d = (ps) => ps.map((p, k) => `${k ? 'L' : 'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const look = (ch) => {
      const p = ch.pts[Math.floor(ch.pts.length / 2)];
      const color = mix(FROSTC, ch.i === 0 ? QUBIT : BRASS, p.tint);
      return { color: rgb(mix(BGC, color, (ch.front ? 1 : 0.62) * p.a)), w: p.w };
    };
    const line = (ch, stroke, w) => el('path', { d: d(ch.pts), fill: 'none', stroke, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    for (const ch of chunks.filter((c) => !c.front)) line(ch, look(ch).color, look(ch).w);
    for (const ch of chunks.filter((c) => c.front)) line(ch, BG, look(ch).w + 2.2 * S);
    for (const ch of chunks.filter((c) => c.front)) line(ch, look(ch).color, look(ch).w);
  }

  el('rect', { width: W, height: H, fill: BG });
  if (sidebar) {
    const size = 62 * S;
    const mx = (W - size) / 2;
    const my = 30 * S;
    const stemY = my + (size * 896) / 1024;
    const endY = 268 * S;
    braid((t) => ({ x: W / 2, y: stemY + (endY - stemY) * t, nx: 1, ny: 0 }), { turns: 3, amp: 13 * S, startWidth: (size * 120) / 1024 / 2, fadeOut: 0.04 });
    mark(mx, my, size);
    el('text', { x: W / 2, y: 292 * S, fill: '#808CA6', 'font-family': 'Instrument Sans', 'font-size': 10.5 * S, 'text-anchor': 'middle', 'letter-spacing': 0.2 * S }).textContent = 'Your Local IDE';
  } else {
    const size = 34 * S;
    const mx = W - size - 14 * S;
    const my = (H - size) / 2 + 1 * S;
    // The lines come in from the left and run into the mark's arms.
    braid((t) => ({ x: t * (mx + 6 * S), y: H / 2, nx: 0, ny: 1 }), { turns: 2, amp: 5 * S, fadeIn: 0.35, end: 1.05 });
    mark(mx, my, size);
  }
</script>
</body>
</html>
