       which one passes under) in one colour on a flat cryostat-blue tile.
       Source of every icon in this folder: regenerate them with
       `node ../../node_modules/@tauri-apps/cli/tauri.js icon src-tauri/icons/ylide.svg`
       from apps/desktop. -->
